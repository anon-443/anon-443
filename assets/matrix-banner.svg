<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">ADEEN matrix cyber banner</title>
  <desc id="desc">Animated matrix rainfall behind an ASCII-style ADEEN wordmark and purple team security tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070D"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#17112B"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#00D9A6"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F97316"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="clip"><rect x="18" y="18" width="1164" height="294" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#clip)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#00D9A6" opacity=".42">
    <g>
      <text x="55" y="-20">01 10 11 00 10 01</text><text x="55" y="-20"><animate attributeName="y" values="-20;350" dur="7s" repeatCount="indefinite"/></text>
      <text x="160" y="-100">sudo ./purple-team.sh</text><text x="160" y="-100"><animate attributeName="y" values="-100;350" dur="9s" begin="-4s" repeatCount="indefinite"/></text>
      <text x="310" y="-55">11001010 01001101</text><text x="310" y="-55"><animate attributeName="y" values="-55;350" dur="6s" begin="-2s" repeatCount="indefinite"/></text>
      <text x="470" y="-180">DETECT VALIDATE HARDEN</text><text x="470" y="-180"><animate attributeName="y" values="-180;350" dur="10s" begin="-6s" repeatCount="indefinite"/></text>
      <text x="660" y="-25">0x7C3AED 0x00D9A6</text><text x="660" y="-25"><animate attributeName="y" values="-25;350" dur="8s" begin="-1s" repeatCount="indefinite"/></text>
      <text x="850" y="-140">red_team.log</text><text x="850" y="-140"><animate attributeName="y" values="-140;350" dur="7.5s" begin="-5s" repeatCount="indefinite"/></text>
      <text x="1030" y="-70">AI://MONITOR</text><text x="1030" y="-70"><animate attributeName="y" values="-70;350" dur="9.5s" begin="-3s" repeatCount="indefinite"/></text>
      <text x="1120" y="-210">10110101</text><text x="1120" y="-210"><animate attributeName="y" values="-210;350" dur="6.5s" begin="-1.5s" repeatCount="indefinite"/></text>
    </g>
    <g fill="#A78BFA" opacity=".35">
      <text x="105" y="-75">purple_ops</text><text x="105" y="-75"><animate attributeName="y" values="-75;350" dur="11s" begin="-3s" repeatCount="indefinite"/></text>
      <text x="545" y="-110">trust_score--</text><text x="545" y="-110"><animate attributeName="y" values="-110;350" dur="8.5s" begin="-5s" repeatCount="indefinite"/></text>
      <text x="760" y="-45">YARA // SIGINT</text><text x="760" y="-45"><animate attributeName="y" values="-45;350" dur="7s" begin="-2s" repeatCount="indefinite"/></text>
    </g>
  </g>
  <rect x="18" y="18" width="1164" height="294" rx="18" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="42" y="42" width="1116" height="246" rx="12" fill="#05070D" fill-opacity=".72" stroke="#00D9A6" stroke-opacity=".35"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="600" y="88" font-size="15" fill="#94A3B8">┌──(adeen㉿purple-lab)-[~/security] ──┐</text>
    <text x="600" y="178" font-size="66" font-weight="700" letter-spacing="8" fill="#F8FAFC" stroke="url(#glow)" stroke-width="1">ADEEN</text>
    <text x="600" y="218" font-size="17" fill="#00D9A6">PURPLE TEAM // RED TEAM // AI AUTOMATION</text>
    <text x="600" y="258" font-size="14" fill="#CBD5E1">detect → investigate → validate → automate → harden</text>
  </g>
  <rect x="42" y="42" width="1116" height="246" rx="12" fill="none" stroke="#A78BFA" stroke-opacity=".14" stroke-width="8" filter="url(#soft)"/>
</svg>
