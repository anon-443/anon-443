<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" role="img" aria-labelledby="title desc">
  <title id="title">Purple team security skills</title>
  <desc id="desc">Four evenly sized animated security skill icons for Purple Team, Threat Detection, AI Automation, and Secure Engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#070A12"/><stop offset=".5" stop-color="#17112B"/><stop offset="1" stop-color="#0B2E2B"/></linearGradient>
    <symbol id="purple-icon" viewBox="0 0 64 64"><circle cx="32" cy="32" r="19" fill="none" stroke="#A78BFA" stroke-width="3"><animate attributeName="r" values="18;21;18" dur="2.6s" repeatCount="indefinite"/></circle><path d="M21 32l8 8 15-18" fill="none" stroke="#00D9A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="detect-icon" viewBox="0 0 64 64"><path d="M32 10l19 8v16c0 12-8 20-19 26-11-6-19-14-19-26V18z" fill="none" stroke="#F97316" stroke-width="3"/><path d="M22 32h20M32 22v20" stroke="#00D9A6" stroke-width="4" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="5s" repeatCount="indefinite"/></path></symbol>
    <symbol id="ai-icon" viewBox="0 0 64 64"><circle cx="32" cy="32" r="19" fill="none" stroke="#00D9A6" stroke-width="3"/><circle cx="32" cy="32" r="6" fill="#F97316"><animate attributeName="r" values="5;8;5" dur="1.7s" repeatCount="indefinite"/></circle><path d="M32 7v17M32 40v17M7 32h17M40 32h17" stroke="#A78BFA" stroke-width="3"/></symbol>
    <symbol id="secure-icon" viewBox="0 0 64 64"><path d="M32 10l19 8v16c0 12-8 20-19 26-11-6-19-14-19-26V18z" fill="none" stroke="#60A5FA" stroke-width="3"/><path d="M20 32l9 9 17-19" fill="none" stroke="#00D9A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
  <rect width="800" height="210" rx="18" fill="url(#bg)" stroke="#334155"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(10 15)"><rect width="185" height="180" rx="14" fill="#111827" stroke="#7C3AED"/><svg x="68.5" y="22" width="48" height="48" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet" style="width:48px;height:48px;display:block"><use href="#purple-icon" x="0" y="0" width="64" height="64"/></svg><text x="92.5" y="125" font-size="13" fill="#F8FAFC">PURPLE TEAM</text><text x="92.5" y="148" font-size="10" fill="#A78BFA">validate | improve</text></g>
    <g transform="translate(205 15)"><rect width="185" height="180" rx="14" fill="#111827" stroke="#E11D48"/><svg x="68.5" y="22" width="48" height="48" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet" style="width:48px;height:48px;display:block"><use href="#detect-icon" x="0" y="0" width="64" height="64"/></svg><text x="92.5" y="125" font-size="12" fill="#F8FAFC">THREAT DETECTION</text><text x="92.5" y="148" font-size="10" fill="#F97316">observe | correlate</text></g>
    <g transform="translate(400 15)"><rect width="185" height="180" rx="14" fill="#111827" stroke="#00D9A6"/><svg x="68.5" y="22" width="48" height="48" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet" style="width:48px;height:48px;display:block"><use href="#ai-icon" x="0" y="0" width="64" height="64"/></svg><text x="92.5" y="125" font-size="13" fill="#F8FAFC">AI AUTOMATION</text><text x="92.5" y="148" font-size="10" fill="#00D9A6">analyze | automate</text></g>
    <g transform="translate(595 15)"><rect width="195" height="180" rx="14" fill="#111827" stroke="#2563EB"/><svg x="73.5" y="22" width="48" height="48" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet" style="width:48px;height:48px;display:block"><use href="#secure-icon" x="0" y="0" width="64" height="64"/></svg><text x="97.5" y="125" font-size="11" fill="#F8FAFC">SECURE ENGINEERING</text><text x="97.5" y="148" font-size="10" fill="#60A5FA">design | harden</text></g>
  </g>
</svg>
