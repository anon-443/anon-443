<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Purple team cyber threat simulation</title>
  <desc id="desc">Animated simulated attack paths moving between regional nodes. This is a visual simulation, not live Internet attack data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#070A12"/><stop offset=".55" stop-color="#17112B"/><stop offset="1" stop-color="#0B2E2B"/></linearGradient>
    <linearGradient id="route" x1="0" x2="1"><stop stop-color="#F97316"/><stop offset=".48" stop-color="#E11D48"/><stop offset="1" stop-color="#00D9A6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#94A3B8" stroke-opacity=".1"/></pattern>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="472" rx="16" fill="url(#grid)" stroke="#334155"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#CBD5E1">
    <text x="58" y="70" font-size="22" font-weight="700" fill="#00D9A6">PURPLE-LAB // THREAT SIMULATION</text>
    <text x="58" y="101" font-size="14" fill="#F97316">SIMULATED ATTACK PATHS · DEFENSIVE VALIDATION · NOT LIVE INTERNET DATA</text>
    <text x="58" y="457" font-size="13" fill="#94A3B8">SIMULATED SIGNAL</text>
    <text x="1020" y="457" font-size="13" text-anchor="end" fill="#94A3B8">SOC RESPONSE</text>
  </g>
  <g fill="none" stroke="url(#route)" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path id="p1" d="M145 330 Q390 120 605 285 T1035 205" stroke-dasharray="10 16"><animate attributeName="stroke-dashoffset" from="0" to="-260" dur="5s" repeatCount="indefinite"/></path>
    <path id="p2" d="M165 205 Q395 420 650 235 T1000 350" stroke-dasharray="8 18"><animate attributeName="stroke-dashoffset" from="0" to="-260" dur="6s" repeatCount="indefinite"/></path>
    <path id="p3" d="M300 390 Q470 175 770 190 T1050 285" stroke-dasharray="5 20"><animate attributeName="stroke-dashoffset" from="0" to="-260" dur="4s" repeatCount="indefinite"/></path>
  </g>
  <g filter="url(#glow)">
    <g><circle cx="145" cy="330" r="10" fill="#F97316"><animate attributeName="r" values="8;14;8" dur="2s" repeatCount="indefinite"/></circle><circle cx="145" cy="330" r="19" fill="none" stroke="#F97316" opacity=".45"><animate attributeName="r" values="16;29;16" dur="2s" repeatCount="indefinite"/></circle></g>
    <g><circle cx="165" cy="205" r="10" fill="#F97316"><animate attributeName="r" values="8;14;8" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="165" cy="205" r="19" fill="none" stroke="#F97316" opacity=".45"><animate attributeName="r" values="16;29;16" dur="2.4s" repeatCount="indefinite"/></circle></g>
    <g><circle cx="605" cy="285" r="10" fill="#A78BFA"><animate attributeName="r" values="8;14;8" dur="2.1s" repeatCount="indefinite"/></circle><circle cx="605" cy="285" r="19" fill="none" stroke="#A78BFA" opacity=".45"><animate attributeName="r" values="16;29;16" dur="2.1s" repeatCount="indefinite"/></circle></g>
    <g><circle cx="1035" cy="205" r="11" fill="#00D9A6"><animate attributeName="r" values="9;15;9" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="1035" cy="205" r="20" fill="none" stroke="#00D9A6" opacity=".45"><animate attributeName="r" values="16;30;16" dur="1.8s" repeatCount="indefinite"/></circle></g>
    <g><circle cx="1000" cy="350" r="11" fill="#00D9A6"><animate attributeName="r" values="9;15;9" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="1000" cy="350" r="20" fill="none" stroke="#00D9A6" opacity=".45"><animate attributeName="r" values="16;30;16" dur="2.2s" repeatCount="indefinite"/></circle></g>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="120" y="370" fill="#F97316">ATTACK SIM</text><text x="136" y="185" fill="#F97316">RECON</text>
    <text x="570" y="322" fill="#A78BFA">CORRELATE</text><text x="1000" y="180" fill="#00D9A6">DETECT</text><text x="950" y="388" fill="#00D9A6">HARDEN</text>
  </g>
</svg>
